<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    /* about page-specific layout */
    .about {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.75rem;
      padding: 4rem 2rem 6rem;
      position: relative;
      z-index: 2;
    }

    .about__copy {
      max-width: 36rem;
      font-size: clamp(1rem, 1.45vw, 1.12rem);
      line-height: 1.65;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.86);
      text-align: center;
      letter-spacing: 0.005em;
    }

    .about__copy p + p { margin-top: 1.1rem; }

    @media (max-width: 600px) {
      .about { padding: 2.5rem 1.5rem 4rem; gap: 2rem; }
      .about__copy { text-align: left; }

<body>
  <canvas id="grain" class="noise-overlay" aria-hidden="true"></canvas>
  <header class="topnav">
    <a class="link-quiet topnav__brand" href="index.html" aria-label="Purpl home">home</a>

      <a class="link-quiet" href="work.html">our work</a>
      <a class="link-quiet" href="index.html#contact">contact</a>
